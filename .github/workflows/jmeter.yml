name: JMeter Test

on:
  workflow_dispatch:

j

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JMeter
        run: |
          curl -fsSL -o jmeter.tgz https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf jmeter.tgz

      - name: Run JMeter test
        run: |
          rm -rf results.jtl report
          apache-jmeter-5.6.3/bin/jmeter -n -t Api.jmx -l results.jtl -e -o report

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: report/

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-jtl
          path: results.jtl
